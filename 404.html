<!DOCTYPE html>
<!--
  This file solves a specific GitHub Pages problem: GitHub Pages only
  knows about real files (like /index.html), not React Router's
  client-side routes. So if someone directly visits or refreshes
  https://aeeusc.github.io/aee-website/login, GitHub Pages looks for a
  real file at that path, doesn't find one, and serves this 404.html
  file instead (GitHub Pages does this automatically for any unknown
  path in a project site).

  Instead of showing a real error, this script redirects the browser
  back to index.html while preserving the intended path in the URL's
  query string. index.html (via the tiny script also added there) then
  reads that query string and uses React Router to restore the correct
  page. Net effect: refreshing /login just works.

  This is the standard, widely-used workaround for SPA routing on
  GitHub Pages (originally popularized by the spa-github-pages project).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AEE at USC</title>
    <script>
      // Redirect e.g. /aee-website/login -> /aee-website/?/login
      var pathSegmentsToKeep = 1; // "aee-website" — the repo name segment GitHub Pages requires
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
