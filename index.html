<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons. Rebuilt 2026-08-29 because Google was showing the grey
         globe placeholder next to aeeusc.com instead of the logo, and
         there were three independent reasons for it:

         1. The path was wrong. It read href="public/logo.svg", but Vite
            copies the CONTENTS of public/ to the site root, so the file
            is served at /logo.svg. It was also relative, so from
            /teams/charged the browser asked for
            /teams/public/logo.svg. It 404'd from every URL on the site.

         2. The format. Google Search does not use SVG favicons at all:
            it supports BMP, GIF, ICO, PNG, JPEG, PPM and TIFF. A correct
            path to an SVG would still have shown the globe.

         3. The artwork. logo.svg is a WHITE mark on transparency inside
            an A4 portrait page. Google requires a square, and a white
            mark on transparency is invisible against the white search
            result row anyway.

         So these are square PNGs and an ICO, generated from that same
         logo on the brand blue the guide calls "the mark's own field",
         with the mark inset to two thirds so it survives being cropped
         to a circle. Paths are absolute, which matters on a site with
         nested routes.

         Google reads the favicon from the HOME PAGE only, and re-crawls
         on its own schedule: expect days to weeks, not minutes. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO — added 2026-08-08. This is a client-rendered SPA (no
         server-side rendering), so per-page <title>/meta tags set from
         inside React Router routes are invisible to most crawlers and to
         link-preview bots (they don't run JavaScript before reading
         <head>). That means THIS static file is what actually shows up
         in Google results and when the site's link is shared on
         iMessage/Slack/Discord/etc. — one shared title/description for
         the whole site is the correct trade-off here, not a compromise,
         short of adding a server-rendering step later. -->
    <title>AEE at USC | Association of Energy Engineers</title>
    <meta
      name="description"
      content="Association of Energy Engineers (AEE) at USC is a student organization designing real renewable energy systems through nationally competing design teams and industry partnerships."
    />
    <link rel="canonical" href="https://aeeusc.com/" />

    <!-- Open Graph — controls how the link looks when shared on
         iMessage, Slack, Discord, LinkedIn, Facebook, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AEE at USC" />
    <meta property="og:title" content="AEE at USC | Association of Energy Engineers" />
    <meta
      property="og:description"
      content="A USC student organization designing real renewable energy systems through nationally competing design teams and industry partnerships."
    />
    <meta property="og:url" content="https://aeeusc.com/" />

    <!-- og:image and twitter:image pointed at /logo.svg until 2026-08-29.
         The path was right, unlike the favicon's, but essentially no
         link-preview service renders SVG: Facebook, LinkedIn, Slack,
         Discord and iMessage all want PNG or JPEG. They also want a card
         around 1.91:1, and logo.svg is a portrait A4 page holding a
         white mark on transparency. So shared links showed no image at
         all. og-card.png is 1200x630, built from the same logo and the
         site's own two fonts. -->
    <meta property="og:image" content="https://aeeusc.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AEE at USC, the Association of Energy Engineers" />

    <!-- Twitter/X card — falls back to the Open Graph tags above on most
         platforms, but Twitter/X specifically wants its own tag names. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AEE at USC | Association of Energy Engineers" />
    <meta
      name="twitter:description"
      content="A USC student organization designing real renewable energy systems through nationally competing design teams and industry partnerships."
    />
    <meta name="twitter:image" content="https://aeeusc.com/og-card.png" />

    <!-- Brand typefaces are self-hosted via @fontsource and imported in
         src/main.jsx, so there is deliberately no Google Fonts link here:
         the faces cannot fail to a system sans, and the browser never
         contacts a third party to render the page. -->
    <script>
      // GitHub Pages SPA-routing fix, part 2 of 2 (see public/404.html
      // for part 1). Reverses the redirect 404.html performs, turning
      // https://aeeusc.com/?/login back into a normal browser history
      // entry at aeeusc.com/login BEFORE React Router reads the URL.
      // Must run before src/main.jsx. This part didn't need to change
      // when 404.html's pathSegmentsToKeep was fixed for root hosting —
      // l.pathname.slice(0, -1) on the root path "/" already correctly
      // produces an empty string either way.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>

    <!-- Organization markup, added 2026-08-29. Separate from the
         favicon above and worth having for the same reason: the favicon
         is the small icon beside the search result, while `logo` here is
         what Google can use for a knowledge panel, and `alternateName`
         is how it learns that "AEE" and the full name are the same
         organization. Structured data is a signal, not a guarantee. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Association of Energy Engineers at USC",
        "alternateName": ["AEE at USC", "AEE USC", "AEE"],
        "url": "https://aeeusc.com/",
        "logo": "https://aeeusc.com/icon-512.png",
        "image": "https://aeeusc.com/og-card.png",
        "description": "A student organization at the University of Southern California designing real renewable energy systems through nationally competing design teams and industry partnerships.",
        "foundingDate": "2024",
        "sameAs": [
          "https://www.instagram.com/aeeusc",
          "https://www.linkedin.com/company/association-of-energy-engineers-usc/"
        ],
        "parentOrganization": {
          "@type": "CollegeOrUniversity",
          "name": "University of Southern California",
          "url": "https://www.usc.edu/"
        }
      }
    </script>
    <script type="module" crossorigin src="/assets/index-CpspsCB1.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BFoEFDr1.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
