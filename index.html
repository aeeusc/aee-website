<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO — added 2026-08-08. This is a client-rendered SPA (no
         server-side rendering), so per-page <title>/meta tags set from
         inside React Router routes are invisible to most crawlers and to
         link-preview bots (they don't run JavaScript before reading
         <head>). That means THIS static file is what actually shows up
         in Google results and when the site's link is shared on
         iMessage/Slack/Discord/etc. — one shared title/description for
         the whole site is the correct trade-off here, not a compromise,
         short of adding a server-rendering step later. -->
    <title>AEE at USC | Alternative Energy Engineering</title>
    <meta
      name="description"
      content="Alternative Energy Engineering (AEE) at USC is a student organization designing real renewable energy systems — wind, marine, hydropower, and solar — through nationally competing design teams and industry partnerships."
    />
    <link rel="canonical" href="https://aeeusc.com/" />

    <!-- Open Graph — controls how the link looks when shared on
         iMessage, Slack, Discord, LinkedIn, Facebook, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AEE at USC" />
    <meta property="og:title" content="AEE at USC | Alternative Energy Engineering" />
    <meta
      property="og:description"
      content="A USC student organization designing real renewable energy systems through nationally competing design teams and industry partnerships."
    />
    <meta property="og:url" content="https://aeeusc.com/" />
    <meta property="og:image" content="https://aeeusc.com/logo.svg" />

    <!-- Twitter/X card — falls back to the Open Graph tags above on most
         platforms, but Twitter/X specifically wants its own tag names. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AEE at USC | Alternative Energy Engineering" />
    <meta
      name="twitter:description"
      content="A USC student organization designing real renewable energy systems through nationally competing design teams and industry partnerships."
    />
    <meta name="twitter:image" content="https://aeeusc.com/logo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // GitHub Pages SPA-routing fix, part 2 of 2 (see public/404.html
      // for part 1). Reverses the redirect 404.html performs, turning
      // https://aeeusc.com/?/login back into a normal browser history
      // entry at aeeusc.com/login BEFORE React Router reads the URL.
      // Must run before src/main.jsx. This part didn't need to change
      // when 404.html's pathSegmentsToKeep was fixed for root hosting —
      // l.pathname.slice(0, -1) on the root path "/" already correctly
      // produces an empty string either way.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/assets/index-DSrZ0zbC.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BKClDdwQ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
